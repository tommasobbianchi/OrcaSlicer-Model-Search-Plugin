# Publishing a GitHub release here replaces the manual browser upload described
# in HANDOFF.md. The hub identifies the run by an OIDC token GitHub signs, so
# there is no token or secret in this repository. Requires the repository to be
# connected under Edit plugin > GitHub publishing on cloud.orcaslicer.com.
name: Publish to OrcaCloud

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The hub takes the version from the tag, not from the file. Publishing a
      # release whose files disagree with it is what burned 0.2.1, so refuse the
      # mismatch instead of shipping the wrong code under a new version number.
      - name: Check the tag matches the PEP 723 version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          header="$(sed -n 's/^# version = "\(.*\)"$/\1/p' search_engine.py | head -1)"
          echo "tag=$tag header=$header"
          [ "$tag" = "$header" ]

      # One plugin, one file, but the hub keeps a separate entry per target
      # suffix and derives "Supported OS" from them.
      - name: Fan the plugin out to the seven targets
        run: |
          set -euo pipefail
          mkdir -p dist
          for t in linux_x86_64 linux_arm64 win_x86_64 win_arm64 \
                   macosx_x86_64 macosx_arm64 macosx_universal; do
            cp search_engine.py "dist/search_engine_$t.py"
          done

      - name: Publish release to OrcaCloud
        env:
          PLUGIN_FILES: "dist/search_engine_*.py"
        run: |
          set -euo pipefail
          oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          version="${GITHUB_REF_NAME#v}"
          changelog="$(jq -r '.release.body // ""' "$GITHUB_EVENT_PATH" | head -c 4000)"
          jq -cn --arg version "$version" --arg changelog "$changelog" \
            '{version: $version} + (if $changelog == "" then {} else {changelog: $changelog} end)' \
            > metadata.json
          # Read from the file, never -F "metadata=$json": curl treats ';' in an
          # -F value as a parameter separator (;type=, ;filename=), so a single
          # semicolon anywhere in the release notes turns the body into
          # VALIDATION_ERROR "Metadata must be valid JSON". Cost a failed Support
          # Fins publish on 2026-09-21.
          args=(-F "metadata=<metadata.json")
          shopt -s nullglob
          for file in $PLUGIN_FILES; do
            args+=(-F "files=@$file")
          done
          if [ "${#args[@]}" -eq 1 ]; then
            echo "No plugin files matched: $PLUGIN_FILES" >&2
            exit 1
          fi
          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            "${args[@]}" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          cat response.json
          echo
          echo "http_status=$status"
          # 201 is "published". The hub also answers 2xx with
          # {"status":"held_for_review"} when its AI scan flags the submission —
          # that is an ACCEPTED upload awaiting a maintainer, not a failure, and
          # the old `[ "$status" = "201" ]` reported the first 0.4.0 publish as
          # broken when the release had in fact landed. Fail only on a non-2xx.
          case "$status" in
            2??) ;;
            *) echo "OrcaCloud refused the release (HTTP $status)" >&2; exit 1 ;;
          esac
          if [ "$(jq -r '.status // ""' response.json)" = "held_for_review" ]; then
            echo "::notice::Uploaded and HELD FOR REVIEW — not live until a maintainer approves it."
          fi
